<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NestWorth</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NestWorth">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2E7D5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F3F6EF; --card:#FFFFFF; --ink:#1B3327; --ink2:#4C5E52; --line:#DCE4D4; --green:#2E7D5B; --green-d:#215E44; --soft:#E4F0E8; --gold:#C99334; --bad:#b4462f; --shadow:0 1px 2px rgba(27,51,39,.05),0 12px 30px -14px rgba(27,51,39,.22); }
  @media (prefers-color-scheme:dark){ :root{ --bg:#111A13; --card:#18221A; --ink:#EAF1E7; --ink2:#A7B7AA; --line:#2A372C; --green:#57BC8F; --green-d:#3E9E74; --soft:#1C2C22; --gold:#E4B457; --bad:#e07a5f; --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -16px rgba(0,0,0,.55);} }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom)}
  .disp{font-family:"Fraunces",Georgia,serif}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  /* screens */
  .screen{display:none} .screen.on{display:block}
  /* splash / signin */
  .center{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
  .logo{width:96px;height:96px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:18px}
  .brand{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:38px;margin:0 0 6px;color:var(--ink)}
  .tag{color:var(--ink2);font-size:15px;margin:0 0 26px;max-width:30ch}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:340px;padding:15px 18px;border:0;border-radius:14px;background:var(--green);color:#fff;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{opacity:.5}
  .btn.sec{background:transparent;color:var(--green);box-shadow:none;border:1px solid var(--line)}
  .fine{margin-top:16px;font-size:12.5px;color:var(--ink2);max-width:32ch}
  .err{color:var(--bad);font-size:13.5px;margin-top:14px;max-width:36ch}
  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
  .top .who{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .title{font-family:"Fraunces",serif;font-weight:600;font-size:22px}
  .lnk{color:var(--green);font-size:13px;font-weight:600;background:none;border:0;cursor:pointer;padding:6px}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:0 0 12px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .ri{flex:0 0 34px;color:var(--ink2)}
  .row label{flex:0 0 84px;font-size:14px;color:var(--ink2)}
  .row input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:16px;text-align:right;outline:none}
  .row input::placeholder{color:#9fb0a4}
  .addbtn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:var(--green);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .addbtn:disabled{opacity:.5}
  .msg{font-size:13px;color:var(--ink2);min-height:18px;margin-top:8px;text-align:center}
  .msg.bad{color:var(--bad)}
  /* entries */
  .elist{margin:0;padding:0;list-style:none}
  .eitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .eitem:last-child{border-bottom:0}
  .eitem .l{min-width:0}
  .eitem .co{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eitem .meta{font-size:12.5px;color:var(--ink2)}
  .eitem .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
  .empty{color:var(--ink2);font-size:14px;text-align:center;padding:14px 0}
  .foot{text-align:center;font-size:11px;color:var(--ink2);letter-spacing:.03em;padding:10px 0 2px}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="screen on" id="splash">
  <div class="center">
    <img class="logo" src="apple-touch-icon.png" alt="">
    <div class="brand disp">NestWorth</div>
    <div class="tag"><span class="spin"></span>&nbsp; Loading…</div>
  </div>
</div>

<!-- SIGN IN -->
<div class="screen" id="signinScreen">
  <div class="center">
    <img class="logo" src="apple-touch-icon.png" alt="">
    <div class="brand disp">NestWorth</div>
    <p class="tag">Your budget, savings, and net worth — quietly in your pocket.</p>
    <button class="btn" id="signinBtn">Sign in with Google</button>
    <p class="fine">NestWorth creates one private budget sheet in <b>your own</b> Google Drive and can only touch that one file — nothing else in your account.</p>
    <div class="err" id="signinErr"></div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="appScreen">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title disp">NestWorth</div>
        <div class="who" id="who"></div>
      </div>
      <button class="lnk" id="signout">Sign out</button>
    </div>

    <div class="card">
      <p class="eyebrow">Add an expense</p>
      <div class="row"><label>Company</label><input id="fCompany" autocomplete="off" placeholder="e.g., Publix"></div>
      <div class="row"><label>Category</label><input id="fCategory" autocomplete="off" placeholder="e.g., Groceries"></div>
      <div class="row"><label>Amount</label><input id="fAmount" inputmode="decimal" placeholder="$0.00"></div>
      <div class="row"><label>Date</label><input id="fDate" type="date"></div>
      <button class="addbtn" id="addBtn">Add entry</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <p class="eyebrow">Recent entries</p>
      <ul class="elist" id="elist"><li class="empty"><span class="spin"></span></li></ul>
    </div>

    <div class="foot" id="foot">NestWorth · phase 2a</div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
var CLIENT_ID = "1048635246954-nj94ab7k529isv8ur8ntncub8sosj8f9.apps.googleusercontent.com";
var SCOPE = "https://www.googleapis.com/auth/drive.file";
var SHEET_NAME = "My Budget";
var LEDGER = "Account Ledger";
var HEADERS = ["Year","Month","Date","Payee","Category","Company","Amount","Description","Reimbursed?"];

var accessToken = null, tokenClient = null, sheetId = null, userEmail = "";

function $(id){ return document.getElementById(id); }
function show(id){ ["splash","signinScreen","appScreen"].forEach(function(s){ $(s).classList.toggle("on", s===id); }); }

/* ---------- auth ---------- */
function getToken(interactive){
  return new Promise(function(resolve, reject){
    try{
      tokenClient.callback = function(resp){
        if(resp && resp.error){ reject(new Error(resp.error)); return; }
        accessToken = resp.access_token;
        resolve(accessToken);
      };
      tokenClient.requestAccessToken({ prompt: interactive ? "" : "none" });
    }catch(e){ reject(e); }
  });
}

async function api(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({ "Authorization": "Bearer " + accessToken }, opts.headers || {});
  var r = await fetch(url, opts);
  if(r.status === 401){
    // token expired — try a silent refresh once, then retry
    await getToken(false);
    opts.headers["Authorization"] = "Bearer " + accessToken;
    r = await fetch(url, opts);
  }
  if(!r.ok){ var t = await r.text(); throw new Error(r.status + " " + t.slice(0,180)); }
  if(r.status === 204) return {};
  return r.json();
}

/* ---------- sheet ---------- */
async function ensureSheet(){
  var stored = "";
  try{ stored = localStorage.getItem("nw_sheet_id") || ""; }catch(e){}
  if(stored){
    try{ await api("https://sheets.googleapis.com/v4/spreadsheets/" + stored + "?fields=spreadsheetId"); sheetId = stored; return; }
    catch(e){ /* stored id no longer valid — fall through */ }
  }
  var q = encodeURIComponent("name='" + SHEET_NAME + "' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  var found = await api("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name)&orderBy=createdTime");
  if(found.files && found.files.length){ sheetId = found.files[0].id; }
  else {
    var made = await api("https://sheets.googleapis.com/v4/spreadsheets", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ properties:{ title: SHEET_NAME }, sheets:[{ properties:{ title: LEDGER } }] })
    });
    sheetId = made.spreadsheetId;
    await api("https://sheets.googleapis.com/v4/spreadsheets/" + sheetId + "/values/" + encodeURIComponent(LEDGER + "!A1") + "?valueInputOption=RAW", {
      method:"PUT", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ values:[ HEADERS ] })
    });
  }
  try{ localStorage.setItem("nw_sheet_id", sheetId); }catch(e){}
}

function money(n){ n = Number(n)||0; return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }

async function loadEntries(){
  var list = $("elist");
  var data = await api("https://sheets.googleapis.com/v4/spreadsheets/" + sheetId + "/values/" + encodeURIComponent(LEDGER + "!A2:I"));
  var rows = data.values || [];
  if(!rows.length){ list.innerHTML = '<li class="empty">No entries yet — add your first one above.</li>'; return; }
  var out = [];
  for(var i = rows.length - 1; i >= 0 && out.length < 25; i--){
    var r = rows[i];
    var date = r[2]||"", cat = r[4]||"", co = r[5]||"", amt = r[6]||0;
    out.push('<li class="eitem"><div class="l"><div class="co">' + esc(co||"(no company)") + '</div><div class="meta">' + esc(date) + (cat?(" · " + esc(cat)):"") + '</div></div><div class="amt">' + money(amt) + '</div></li>');
  }
  list.innerHTML = out.join("");
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

async function addEntry(){
  var co = $("fCompany").value.trim();
  var cat = $("fCategory").value.trim();
  var amtRaw = $("fAmount").value.replace(/[^0-9.\-]/g,"");
  var amt = parseFloat(amtRaw);
  var date = $("fDate").value; // yyyy-mm-dd
  var msg = $("addMsg");
  msg.className = "msg";
  if(!amt || amt <= 0){ msg.textContent = "Enter an amount."; msg.className = "msg bad"; return; }
  if(!date){ msg.textContent = "Pick a date."; msg.className = "msg bad"; return; }
  var d = new Date(date + "T00:00:00");
  var year = d.getFullYear(), month = d.getMonth() + 1;
  var b = $("addBtn"); b.disabled = true; b.textContent = "Adding…";
  try{
    await api("https://sheets.googleapis.com/v4/spreadsheets/" + sheetId + "/values/" + encodeURIComponent(LEDGER + "!A:I") + ":append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ values:[[ year, month, date, "", cat, co, amt, "", "" ]] })
    });
    $("fCompany").value = ""; $("fCategory").value = ""; $("fAmount").value = "";
    msg.textContent = "Added ✓";
    await loadEntries();
    setTimeout(function(){ if(msg.textContent === "Added ✓") msg.textContent = ""; }, 1800);
  }catch(e){
    msg.textContent = "Could not add: " + (e.message || e); msg.className = "msg bad";
  }
  b.disabled = false; b.textContent = "Add entry";
}

/* ---------- boot ---------- */
async function enterApp(){
  show("splash");
  try{
    var about = await api("https://www.googleapis.com/drive/v3/about?fields=user");
    userEmail = (about.user && about.user.emailAddress) || "";
    $("who").textContent = userEmail ? ("Signed in as " + userEmail) : "";
    await ensureSheet();
    var today = new Date();
    $("fDate").value = today.getFullYear() + "-" + ("0"+(today.getMonth()+1)).slice(-2) + "-" + ("0"+today.getDate()).slice(-2);
    show("appScreen");
    await loadEntries();
  }catch(e){
    $("signinErr").textContent = "Something went wrong: " + (e.message || e);
    show("signinScreen");
  }
}

function wire(){
  $("signinBtn").addEventListener("click", async function(){
    $("signinErr").textContent = "";
    var b = this; b.disabled = true; b.textContent = "Opening Google…";
    try{ await getToken(true); await enterApp(); }
    catch(e){ $("signinErr").textContent = "Sign-in was cancelled or blocked."; }
    b.disabled = false; b.textContent = "Sign in with Google";
  });
  $("addBtn").addEventListener("click", addEntry);
  $("signout").addEventListener("click", function(){
    accessToken = null;
    try{ if(google && google.accounts && google.accounts.oauth2 && window.__tok) google.accounts.oauth2.revoke(window.__tok); }catch(e){}
    show("signinScreen");
  });
}

(function poll(){
  if(window.google && google.accounts && google.accounts.oauth2){
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: function(){} });
    wire();
    // try a silent sign-in so returning users skip the button
    getToken(false).then(enterApp).catch(function(){ show("signinScreen"); });
    return;
  }
  setTimeout(poll, 120);
})();
</script>
</body>
</html>
